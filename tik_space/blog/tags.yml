# Blog tag vocabulary.
#
# Docusaurus keeps blog tags in a separate namespace from doc tags, so this file is
# necessarily separate from docs/tags.yml — but the WORDS should match wherever they
# overlap, so the same subject is not called two things on one site. Keys here that also
# exist in docs/tags.yml must keep the same key and label.

ai:
  label: AI
  permalink: /ai
  description: Working with LLM tooling — MCP servers, agents and editor integrations.

kubernetes:
  label: Kubernetes
  permalink: /kubernetes
  description: Cluster operations, GitOps and workload configuration.

distributed-systems:
  label: Distributed systems
  permalink: /distributed-systems
  description: Service boundaries, partial failure and the patterns around them.

networking:
  label: Networking
  permalink: /networking
  description: Protocols, transports and peer-to-peer networks.

cryptography:
  label: Cryptography
  permalink: /cryptography
  description: Curves, signatures and key handling.

trading:
  label: Trading & markets
  permalink: /trading
  description: Market mechanics and on-chain yield.

archive:
  label: Archive
  permalink: /archive
  description: Older posts kept for the record.
