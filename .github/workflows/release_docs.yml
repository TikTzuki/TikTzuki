name: Release Docs to www.tiktuzki.com

on:
  workflow_dispatch:
    inputs:
      alert_drill:
        # Fire drill for the failure alert: fails `deploy` before checkout, so nothing is built
        # or published, and lets `report` open its issue. Run a normal dispatch afterwards to
        # see it close.  gh workflow run release_docs.yml -f alert_drill=true
        description: "Fail on purpose to test the failure alert (publishes nothing)"
        type: boolean
        default: false
  push:
    branches: [ master ]
  # Docs synced from tiktuzki-gitops / senior-architect change without a push
  # here. The nightly run picks those up; the dispatch lets a source repo
  # trigger a rebuild immediately via:
  #   gh api repos/TikTzuki/TikTzuki/dispatches -f event_type=knowledge-updated
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [ knowledge-updated ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    # node1's ARC runner when the repo variable CI_RUNNER is set to `node1`, GitHub-hosted
    # otherwise. Clearing the variable (`gh variable delete CI_RUNNER`) is the escape hatch
    # when node1 is down — which matters here, because this job also runs on a nightly
    # schedule with nobody watching. See tiktuzki-gitops/infra/arc-runners/README.md.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Alert drill
        if: inputs.alert_drill
        run: |
          echo "::error::alert_drill=true — failing on purpose, before anything is built or published."
          exit 1

      - uses: actions/checkout@v5
        
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Version comes from tik_space/package.json "packageManager". `latest` pulled
          # pnpm 12, which fails the install on unapproved build scripts.
          package_json_file: tik_space/package.json

      - name: Install dependencies
        run: pnpm install
        working-directory: ${{ github.workspace }}/tik_space

      # Docs owned by tiktuzki-gitops and senior-architect are pulled in here.
      # `pnpm build` would run this anyway; it is a separate step so that a
      # failure to reach a source repo is obvious in the log rather than
      # buried in the build output.
      - name: Sync knowledge from source repos
        run: pnpm sync
        working-directory: ${{ github.workspace }}/tik_space
        env:
          # tiktuzki-gitops is private: cloned over SSH with a read-only deploy key on that
          # repo. A key, not a token, so it cannot silently expire the nightly build.
          GITOPS_READ_KEY: ${{ secrets.GITOPS_READ_KEY }}

      - name: Build site
        run: pnpm build
        working-directory: ${{ github.workspace }}/tik_space
        env:
          # `pnpm build` runs `pnpm sync` again, so it needs the same key.
          GITOPS_READ_KEY: ${{ secrets.GITOPS_READ_KEY }}

      - name: Deploy to tiktuzki.com
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: TikTzuki/tiktzuki.github.io
          publish_dir: ${{ github.workspace }}/tik_space/build
          # SSH deploy key with write access to tiktzuki.github.io only. A key, not a PAT,
          # because PATs expire: PERSONAL_TOKEN expiring is what kept this deploy failing from
          # 2025-11 even after every other step was fixed. Rotate by replacing the deploy key
          # on that repo and this secret together.
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_branch: gh-pages
          # Without this the deploy replaces gh-pages with a tree that has no CNAME, and GitHub
          # Pages drops the custom domain. The hand-made CNAME commit on gh-pages does not survive.
          cname: www.tiktuzki.com
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

  # A failed deploy opens one issue (label `deploy-failure`, assigned to the owner); further
  # failures comment on it; the next successful deploy closes it. So an open `deploy-failure`
  # issue means "the site is broken right now". This exists because the nightly build failed
  # ~40 times from 2025-11 to 2026-10 and nobody heard about it.
  report:
    needs: deploy
    # always() so this runs after a failure too. Cancelled or skipped runs are not news.
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    # GitHub-hosted on purpose: the alert must not depend on node1, which may be what broke.
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const label = 'deploy-failure';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const what = `\`${context.eventName}\` at \`${context.sha.slice(0, 7)}\``;
            const {data: open} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 10,
            });

            if (process.env.RESULT === 'success') {
              for (const issue of open) {
                await github.rest.issues.createComment({...context.repo, issue_number: issue.number,
                  body: `Recovered: ${what} deployed successfully.\n\n${run}`});
                await github.rest.issues.update({...context.repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed'});
              }
              return;
            }

            if (open.length) {
              await github.rest.issues.createComment({...context.repo, issue_number: open[0].number,
                body: `Still failing: ${what}.\n\n${run}`});
              return;
            }
            await github.rest.issues.create({...context.repo,
              title: 'www.tiktuzki.com is not deploying',
              labels: [label],
              assignees: [context.repo.owner],
              body: [
                `The deploy failed on ${what}. Until a run succeeds, www.tiktuzki.com keeps`,
                'serving its last good build.',
                '',
                `Run: ${run}`,
                '',
                'Closed automatically by the next successful deploy. Further failures are added',
                'below as comments.',
              ].join('\n'),
            });
