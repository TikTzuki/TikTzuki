name: Release Docs to www.tiktuzki.com

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  # Docs synced from tiktuzki-gitops / senior-architect change without a push
  # here. The nightly run picks those up; the dispatch lets a source repo
  # trigger a rebuild immediately via:
  #   gh api repos/TikTzuki/TikTzuki/dispatches -f event_type=knowledge-updated
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [ knowledge-updated ]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    # node1's ARC runner when the repo variable CI_RUNNER is set to `node1`, GitHub-hosted
    # otherwise. Clearing the variable (`gh variable delete CI_RUNNER`) is the escape hatch
    # when node1 is down — which matters here, because this job also runs on a nightly
    # schedule with nobody watching. See tiktuzki-gitops/infra/arc-runners/README.md.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Version comes from tik_space/package.json "packageManager". `latest` pulled
          # pnpm 12, which fails the install on unapproved build scripts.
          package_json_file: tik_space/package.json

      - name: Install dependencies
        run: pnpm install
        working-directory: ${{ github.workspace }}/tik_space

      # Docs owned by tiktuzki-gitops and senior-architect are pulled in here.
      # `pnpm build` would run this anyway; it is a separate step so that a
      # failure to reach a source repo is obvious in the log rather than
      # buried in the build output.
      - name: Sync knowledge from source repos
        run: pnpm sync
        working-directory: ${{ github.workspace }}/tik_space
        env:
          # tiktuzki-gitops is private. Fine-grained PAT: only that repo, Contents: read-only.
          KNOWLEDGE_TOKEN: ${{ secrets.KNOWLEDGE_TOKEN }}

      - name: Build site
        run: pnpm build
        working-directory: ${{ github.workspace }}/tik_space
        env:
          # `pnpm build` runs `pnpm sync` again, so it needs the same token.
          KNOWLEDGE_TOKEN: ${{ secrets.KNOWLEDGE_TOKEN }}

      - name: Deploy to tiktuzki.com
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: TikTzuki/tiktzuki.github.io
          publish_dir: ${{ github.workspace }}/tik_space/build
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_branch: gh-pages
          # Without this the deploy replaces gh-pages with a tree that has no CNAME, and GitHub
          # Pages drops the custom domain. The hand-made CNAME commit on gh-pages does not survive.
          cname: www.tiktuzki.com
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
